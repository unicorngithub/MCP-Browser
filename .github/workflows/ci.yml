# 推送 / PR：类型检查 + 测试构建 + Vitest。安装包仅在打 tag 时由 Release 工作流构建（见 release.yml）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test build (Vite + Electron main/preload, mode=test)
        run: pnpm run build:test

      - name: Vitest (unit)
        run: pnpm test

      - name: E2E system deps (virtual display + Electron libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libdrm2 libgtk-3-0 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          pnpm exec playwright install-deps chromium

      - name: E2E (Playwright Electron via xvfb-run)
        run: xvfb-run -a pnpm run test:e2e
        timeout-minutes: 25
