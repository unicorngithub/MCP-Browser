# 推送以 v 开头的 tag（如 v0.1.0）时：在 Windows / macOS 上打包并创建 GitHub Release，附件为安装包。
# 请先同步 package.json 的 version 与 tag（例如 tag v0.1.0 对应 "version": "0.1.0"）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test build
        run: pnpm run pretest

      - name: Vitest
        run: pnpm exec vitest run

      - name: Package
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.label }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      # 只上传用户可下载的安装包（exe / dmg / zip）；勿用 dist/**/*：会把 win-unpacked / .app 内上百个文件挂到 Release。不接 electron-updater 差分更新则不必上传 .blockmap。
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/**/MCP BROWSER_*.exe
            dist/**/MCP BROWSER_*.dmg
            dist/**/MCP BROWSER_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
